name: Build and deploy Lore to Bunny CDN

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lore-bunny
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
  BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
  BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
  BUNNY_PATH: lore

jobs:
  notify-start:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify workflow start
        continue-on-error: true
        shell: bash
        env:
          NTFY_DOOMSDAY_BUILDS: ${{ secrets.NTFY_DOOMSDAY_BUILDS }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_DOOMSDAY_BUILDS:-}" ]; then
            echo "NTFY_DOOMSDAY_BUILDS fehlt; Build-Benachrichtigung übersprungen."
            exit 0
          fi
          repo="${GITHUB_REPOSITORY#*/}"
          timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z')"
          message="${repo} | ${timestamp} | START | ${GITHUB_WORKFLOW} | Event: ${GITHUB_EVENT_NAME} | Branch: ${GITHUB_REF_NAME} | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer ${NTFY_DOOMSDAY_BUILDS}" \
            -H "Title: ${repo} | START | ${GITHUB_WORKFLOW}" \
            --data-binary "$message" \
            https://ntfy.bot.omg.lol/doomsday-github-action

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown

      - name: Validate consistency
        run: |
          python tools/story_consistency/check_group_relationships.py --summary-only
          python tools/story_consistency/check_story_timeline_alignment.py

      - name: Build Lore HTML
        run: |
          if ! curl --fail --location --retry 3 \
            https://doomsday.radio/design-system/latest/design-system.css \
            --output design-system.css; then
            echo "Versioned CDN snapshot is not published yet; using the current public root snapshot."
            curl --fail --location --retry 3 \
              https://doomsday.radio/design-system.css \
              --output design-system.css
          fi
          python build_lore_html.py --output dist

      - name: Validate public design contract
        run: python tools/validate_public_design.py --docs-root dist --canonical-stylesheet design-system.css

      - name: Generate Sitemap
        run: python generate_sitemap.py --docs-root dist --base-url https://doomsday.radio/lore

      - name: Validate required Bunny configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BUNNY_STORAGE_ENDPOINT BUNNY_STORAGE_ZONE BUNNY_STORAGE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub variable/secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Upload Lore to Bunny S3
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${BUNNY_STORAGE_ZONE}/${BUNNY_PATH}/" \
            --endpoint-url "${BUNNY_STORAGE_ENDPOINT}" \
            --delete

      - name: Publish deployment summary
        run: |
          echo "Bunny path: ${BUNNY_PATH}/"
          echo "Bunny endpoint: ${BUNNY_STORAGE_ENDPOINT}"
          echo "Commit: ${GITHUB_SHA}"

  notify-finish:
    if: ${{ always() }}
    needs:
      - notify-start
      - build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify workflow result
        continue-on-error: true
        shell: bash
        env:
          NTFY_DOOMSDAY_BUILDS: ${{ secrets.NTFY_DOOMSDAY_BUILDS }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_DOOMSDAY_BUILDS:-}" ]; then
            echo "NTFY_DOOMSDAY_BUILDS fehlt; Build-Benachrichtigung übersprungen."
            exit 0
          fi
          repo="${GITHUB_REPOSITORY#*/}"
          timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S %Z')"
          result="$(jq -r '[to_entries[] | select(.key != "notify-start") | .value.result] | if index("failure") then "failure" elif index("cancelled") then "cancelled" elif index("success") then "success" else "skipped" end' <<< "$NEEDS_JSON")"
          details="$(jq -r '[to_entries[] | select(.key != "notify-start") | "\(.key): \(.value.result)"] | join(", ")' <<< "$NEEDS_JSON")"
          message="${repo} | ${timestamp} | ENDE: ${result} | ${GITHUB_WORKFLOW} | Jobs: ${details} | Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --output /dev/null \
            --connect-timeout 5 --max-time 20 \
            -H "Authorization: Bearer ${NTFY_DOOMSDAY_BUILDS}" \
            -H "Title: ${repo} | ENDE: ${result} | ${GITHUB_WORKFLOW}" \
            --data-binary "$message" \
            https://ntfy.bot.omg.lol/doomsday-github-action
